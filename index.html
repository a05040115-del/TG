<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>음성 → 텍스트 → (간이) 영어 번역</title>
<style>
  body {
    font-family: 'Malgun Gothic', sans-serif;
    max-width: 680px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f5f6fa;
    color: #222;
  }
  h1 { font-size: 1.4rem; }
  .notice {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    color: #9a3412;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  #controls { margin: 16px 0; display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.2s;
  }
  #startBtn { background: #4f46e5; color: #fff; }
  #startBtn:hover { background: #4338ca; }
  #startBtn.recording { background: #dc2626; }
  #clearBtn { background: #e5e7eb; }
  #clearBtn:hover { background: #d1d5db; }
  #langSelect {
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }
  #status {
    margin: 8px 0;
    font-size: 0.9rem;
    color: #666;
  }
  #status.on { color: #dc2626; font-weight: bold; }
  .panel-title {
    font-size: 0.85rem;
    color: #555;
    margin: 18px 0 6px;
    font-weight: bold;
  }
  #output, #translated {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    min-height: 140px;
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 1.05rem;
  }
  #translated { background: #eef2ff; border-color: #c7d2fe; }
  #interim { color: #999; }
  #error { color: #dc2626; margin-top: 8px; font-size: 0.9rem; }
  .speakRow { margin-top: 10px; }
  .speakRow button { background: #059669; color: #fff; }
  .speakRow button:hover { background: #047857; }
</style>
</head>
<body>

<h1>🎤 음성 → 텍스트 → 영어 (간이) 번역</h1>

<div class="notice">
  ⚠️ 외부 번역 API를 쓰지 않는 조건이라, 아래 번역은 <b>내장된 단어/문장 사전 기반 치환</b> 방식입니다.
  사전에 없는 단어는 번역되지 않고 그대로 남습니다. 복잡한 문장의 정확한 번역은 지원하지 않습니다.
</div>

<div id="controls">
  <select id="langSelect">
    <option value="ko-KR" selected>한국어로 말하기</option>
    <option value="en-US">영어로 말하기</option>
    <option value="ja-JP">日本語で話す</option>
  </select>
  <button id="startBtn">🎙️ 녹음 시작</button>
  <button id="clearBtn">🗑️ 내용 지우기</button>
</div>

<div id="status">대기 중</div>

<div class="panel-title">인식된 원문</div>
<div id="output"><span id="finalText"></span><span id="interim"></span></div>

<div class="panel-title">영어 번역 (사전 기반)</div>
<div id="translated"></div>

<div class="speakRow">
  <button id="speakEnBtn">🔊 영어로 읽어주기</button>
</div>

<div id="error"></div>

<script>
(function () {
  const startBtn = document.getElementById('startBtn');
  const clearBtn = document.getElementById('clearBtn');
  const speakEnBtn = document.getElementById('speakEnBtn');
  const langSelect = document.getElementById('langSelect');
  const statusEl = document.getElementById('status');
  const finalTextEl = document.getElementById('finalText');
  const interimEl = document.getElementById('interim');
  const translatedEl = document.getElementById('translated');
  const errorEl = document.getElementById('error');

  // ------------------------------------------------------------------
  // 아주 간단한 한국어 -> 영어 사전 (필요에 맞게 자유롭게 추가/수정하세요)
  // 긴 구문을 먼저 매칭한 뒤, 남은 부분은 단어 단위로 치환합니다.
  // ------------------------------------------------------------------
  const phraseDict = [
    ['안녕하세요', 'Hello'],
    ['안녕', 'Hi'],
    ['감사합니다', 'Thank you'],
    ['고맙습니다', 'Thank you'],
    ['반갑습니다', 'Nice to meet you'],
    ['잘 지내세요', 'Have a good day'],
    ['어떻게 지내세요', 'How are you'],
    ['괜찮아요', "It's okay"],
    ['죄송합니다', 'I am sorry'],
    ['미안합니다', 'I am sorry'],
    ['네', 'Yes'],
    ['아니요', 'No'],
    ['좋아요', 'Good'],
    ['사랑해요', 'I love you'],
    ['오늘 날씨가 좋네요', 'The weather is nice today'],
  ];

  const wordDict = {
    '저': 'I', '나': 'I', '너': 'you', '우리': 'we',
    '오늘': 'today', '내일': 'tomorrow', '어제': 'yesterday',
    '학교': 'school', '회사': 'company', '집': 'home',
    '밥': 'meal', '물': 'water', '시간': 'time',
    '좋다': 'good', '좋아': 'good', '싫다': 'dislike',
    '가다': 'go', '오다': 'come', '먹다': 'eat',
    '공부': 'study', '일': 'work', '친구': 'friend',
    '날씨': 'weather', '춥다': 'cold', '덥다': 'hot',
    '예요': '', '이에요': '', '입니다': '', '합니다': ''
  };

  function translateToEnglish(text) {
    if (!text.trim()) return '';
    let result = text;

    // 1) 구문 단위 우선 치환
    phraseDict.forEach(([ko, en]) => {
      result = result.split(ko).join(`__${en}__`);
    });

    // 2) 남은 한글 토큰을 단어 사전으로 치환
    result = result.split(/\s+/).map(token => {
      if (token.startsWith('__') && token.endsWith('__')) {
        return token.slice(2, -2);
      }
      const clean = token.replace(/[.,!?~]/g, '');
      if (wordDict[clean] !== undefined) {
        return wordDict[clean];
      }
      return token; // 사전에 없으면 원문 그대로 둠
    }).join(' ');

    return result.replace(/\s+/g, ' ').trim();
  }

  // ------------------------------------------------------------------
  // 음성 인식 (Web Speech API)
  // ------------------------------------------------------------------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    errorEl.textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Edge를 사용해 주세요.';
    startBtn.disabled = true;
  } else {
    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = langSelect.value;

    let isRecording = false;
    let finalTranscript = '';

    langSelect.addEventListener('change', () => {
      recognition.lang = langSelect.value;
    });

    startBtn.addEventListener('click', () => {
      if (!isRecording) {
        errorEl.textContent = '';
        recognition.start();
      } else {
        recognition.stop();
      }
    });

    clearBtn.addEventListener('click', () => {
      finalTranscript = '';
      finalTextEl.textContent = '';
      interimEl.textContent = '';
      translatedEl.textContent = '';
    });

    recognition.onstart = () => {
      isRecording = true;
      startBtn.textContent = '⏹️ 녹음 중지';
      startBtn.classList.add('recording');
      statusEl.textContent = '🔴 듣는 중...';
      statusEl.classList.add('on');
    };

    recognition.onend = () => {
      isRecording = false;
      startBtn.textContent = '🎙️ 녹음 시작';
      startBtn.classList.remove('recording');
      statusEl.textContent = '대기 중';
      statusEl.classList.remove('on');
    };

    recognition.onerror = (event) => {
      let msg = '오류가 발생했습니다: ' + event.error;
      if (event.error === 'not-allowed' || event.error === 'permission-denied') {
        msg = '마이크 권한이 거부되었습니다. 브라우저 설정에서 마이크 접근을 허용해 주세요.';
      } else if (event.error === 'no-speech') {
        msg = '음성이 감지되지 않았습니다.';
      }
      errorEl.textContent = msg;
    };

    recognition.onresult = (event) => {
      let interimTranscript = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          finalTranscript += transcript + ' ';
        } else {
          interimTranscript += transcript;
        }
      }

      finalTextEl.textContent = finalTranscript;
      interimEl.textContent = interimTranscript;
      translatedEl.textContent = translateToEnglish(finalTranscript + interimTranscript);
    };
  }

  // ------------------------------------------------------------------
  // 번역된 영어 텍스트를 TTS로 읽어주기 (Web Speech Synthesis)
  // ------------------------------------------------------------------
  speakEnBtn.addEventListener('click', () => {
    const text = translatedEl.textContent.trim();
    if (!text) {
      errorEl.textContent = '읽어줄 번역 텍스트가 없습니다.';
      return;
    }
    const synth = window.speechSynthesis;
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    synth.speak(utter);
  });
})();
</script>

</body>
</html>
